[general]

mode = context
follow_monitor = true
show_workspace_badge = true
sticky_mode = false


[theme]

name = pywal.ini

background = #111010ff
card_bg = #171616ff
card_selected = #AAAAA3ff

text_color = #e7e6e6ff
subtext_color = #a1a1a1ff
border_color = #8F928Cff

bundle_bg = #171616ff
badge_bg = #AAAAA3ff
badge_text_color = #111010ff

border_width = 2
corner_radius = 15


[layout]

card_width = 145
card_height = 135

card_gap = 10
padding = 10

max_cols = 5

icon_size = 57
icon_radius = 15

error_width = 480
error_height = 160
error_font_size = 13


[icons]

theme = Adwaita
fallback = hicolor
show_letter_fallback = true


[font]

family = Sans
weight = Bold

title_size = 10
icon_letter_size = 24
